<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Caveat"; src: url("assets/fonts/Caveat[wght].ttf") format("truetype"); font-weight: 400 700; }
      @font-face { font-family: "Playfair Italic"; src: url("assets/fonts/PlayfairDisplay-Italic[wght].ttf") format("truetype"); font-weight: 400 900; font-style: italic; }
      @font-face { font-family: "Hind Vadodara"; src: url("assets/fonts/HindVadodara-SemiBold.ttf") format("truetype"); font-weight: 600; }
      @font-face { font-family: "Noto Color Emoji"; src: url("assets/fonts/NotoColorEmoji.ttf") format("truetype"); }
      :root { --ink: #ffffff; --blue: #8fc4ff; --pill-bg: rgba(10, 18, 40, 0.55); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      video.clip { width: 1080px; height: 1920px; object-fit: cover; }
      /* text layer: top third, inside Reels/Shorts safe area (x 90..990, y 250..1350) */
      .txt { position: absolute; left: 120px; right: 140px; z-index: 10; text-align: center; color: var(--ink); opacity: 0; }
      .pill { top: 300px; display: flex; justify-content: center; }
      .pill span { font-family: "Hind Vadodara", "Noto Color Emoji", sans-serif; font-weight: 600; font-size: 58px; line-height: 1.25;
                   background: var(--pill-bg); padding: 16px 34px; border-radius: 999px; backdrop-filter: blur(6px); }
      .hand { top: 420px; font-family: "Caveat", "Noto Color Emoji", cursive; font-weight: 700; font-size: 104px; line-height: 1.05;
              text-shadow: 0 4px 22px rgba(0, 0, 0, 0.8), 0 0 3px rgba(0, 0, 0, 0.95), 0 0 14px rgba(10, 30, 70, 0.6); white-space: pre-line; }
      .hand.small { font-size: 88px; }
      .chapter { top: 360px; font-family: "Playfair Italic", serif; font-style: italic; font-weight: 600; font-size: 72px; letter-spacing: 0.04em;
                 text-shadow: 0 3px 18px rgba(0, 0, 0, 0.7); }
      .chapter small { display: block; font-size: 34px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--blue); margin-bottom: 14px; font-style: normal; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 5; pointer-events: none; }
      #scrim { position: absolute; left: 0; right: 0; top: 0; height: 1000px; z-index: 4; background: linear-gradient(to bottom, rgba(0,0,0,0.45), rgba(0,0,0,0)); }
      #dip { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 6; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24.6" data-width="1080" data-height="1920" data-fps="30">
      <!-- video track (pre-graded 1080x1920 segments, silent) -->
      <video id="v01" class="clip" src="assets/clips/s01.mp4" data-start="0"    data-duration="2.0" data-track-index="0" muted playsinline></video>
      <video id="v02" class="clip" src="assets/clips/s02.mp4" data-start="2.0"  data-duration="1.8" data-track-index="0" muted playsinline></video>
      <video id="v03" class="clip" src="assets/clips/s03.mp4" data-start="3.8"  data-duration="2.6" data-track-index="0" muted playsinline></video>
      <video id="v04" class="clip" src="assets/clips/s04.mp4" data-start="6.4"  data-duration="2.2" data-track-index="0" muted playsinline></video>
      <video id="v05" class="clip" src="assets/clips/s05.mp4" data-start="8.6"  data-duration="1.2" data-track-index="0" muted playsinline></video>
      <video id="v06" class="clip" src="assets/clips/s06.mp4" data-start="9.8"  data-duration="2.2" data-track-index="0" muted playsinline></video>
      <video id="v07" class="clip" src="assets/clips/s07.mp4" data-start="12.0" data-duration="2.0" data-track-index="0" muted playsinline></video>
      <video id="v08" class="clip" src="assets/clips/s08.mp4" data-start="14.0" data-duration="2.2" data-track-index="0" muted playsinline></video>
      <video id="v09" class="clip" src="assets/clips/s09.mp4" data-start="16.2" data-duration="2.2" data-track-index="0" muted playsinline></video>
      <video id="v10" class="clip" src="assets/clips/s10.mp4" data-start="18.4" data-duration="3.0" data-track-index="0" muted playsinline></video>
      <video id="v11" class="clip" src="assets/clips/s11.mp4" data-start="21.4" data-duration="3.2" data-track-index="0" muted playsinline></video>
      <!-- audio bed: live concert ambience (own recordings), mastered -14 LUFS; final segment synced -->
      <audio id="bed" src="assets/bed.wav" data-start="0" data-duration="24.6" data-track-index="1" data-has-audio="true"></audio>

      <!-- overlays -->
      <div id="scrim" class="clip" data-start="0" data-duration="24.6" data-track-index="2"></div>
      <div id="flash" class="clip" data-start="0" data-duration="24.6" data-track-index="2"></div>
      <div id="dip" class="clip" data-start="0" data-duration="24.6" data-track-index="2"></div>
      <div id="t1" class="txt pill" data-start="0" data-duration="2.0" data-track-index="3"><span>He wrote us a love letter…</span></div>
      <div id="t2" class="txt pill" data-start="2.0" data-duration="1.8" data-track-index="3"><span>…so I wrote one back 💌</span></div>
      <div id="h2" data-layout-allow-occlusion="true" class="txt hand" style="top:560px" data-start="2.0" data-duration="1.8" data-track-index="4">Dear Darshan,</div>
      <div id="h3" data-layout-allow-occlusion="true" class="txt hand small" data-start="3.8" data-duration="2.6" data-track-index="4">you said<br />“see you there!”</div>
      <div id="h4" data-layout-allow-occlusion="true" class="txt hand" data-start="6.4" data-duration="2.2" data-track-index="4">so here I am 🌅</div>
      <div id="h5" data-layout-allow-occlusion="true" class="txt hand" data-start="8.6" data-duration="1.2" data-track-index="4">with my people 🤍</div>
      <div id="h6" data-layout-allow-occlusion="true" class="txt hand small" data-start="9.8" data-duration="2.2" data-track-index="4">then the lights<br />went down…</div>
      <div id="c7" class="txt chapter" data-start="12.0" data-duration="2.0" data-track-index="4"><small>tonight</small>Love Letters</div>
      <div id="c8" class="txt chapter" data-start="14.0" data-duration="2.2" data-track-index="4"><small>Chapter 1</small>Out of Control</div>
      <div id="c9" class="txt chapter" data-start="16.2" data-duration="2.2" data-track-index="4"><small>Chapter 2</small>Dard 🥲</div>
      <div id="t10" class="txt pill" data-start="18.4" data-duration="3.0" data-track-index="3"><span>blue family, assemble 💙</span></div>
      <div id="h11" data-layout-allow-occlusion="true" class="txt hand small" style="left:150px;right:190px;font-size:80px" data-start="21.4" data-duration="3.2" data-track-index="4">thank you for the magic.<br />Always, yours 💙</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const pillIn = (sel, t) => tl.fromTo(sel, { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, t);
      // handwritten "writing" reveal: clip-path wipe left→right
      const handIn = (sel, t, d = 0.6) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: d, ease: "power1.inOut" }, t);
      const out = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.15 }, t);
      const chapterIn = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 1.08, filter: "blur(6px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, t);

      tl.set(["#flash", "#dip"], { opacity: 0 }, 0);
      tl.set("#t1", { opacity: 1 }, 0);                 // frame 0 already shows the hook text
      out("#t1", 1.85);
      tl.set("#flash", { opacity: 0.85 }, 2.0).to("#flash", { opacity: 0, duration: 0.25 }, 2.0);   // flash cut into the ticket
      pillIn("#t2", 2.0); handIn("#h2", 2.2, 0.6); out("#t2", 3.65); out("#h2", 3.65);
      handIn("#h3", 3.9, 0.8); out("#h3", 6.25);
      handIn("#h4", 6.5, 0.6); out("#h4", 8.45);
      handIn("#h5", 8.62, 0.45); out("#h5", 9.68);
      handIn("#h6", 9.9, 0.8); out("#h6", 11.6);
      tl.to("#dip", { opacity: 0.85, duration: 0.35 }, 11.6).to("#dip", { opacity: 0, duration: 0.4 }, 12.0);   // lights went down
      chapterIn("#c7", 12.15); out("#c7", 13.85);
      chapterIn("#c8", 14.1); out("#c8", 16.05);
      chapterIn("#c9", 16.3); out("#c9", 18.25);
      tl.set("#flash", { opacity: 0.6 }, 18.4).to("#flash", { opacity: 0, duration: 0.2 }, 18.4);
      pillIn("#t10", 18.5); out("#t10", 21.25);
      handIn("#h11", 21.7, 1.2);
      tl.to("#h11", { opacity: 0, duration: 0.4 }, 24.15);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
