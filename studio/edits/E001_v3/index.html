<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/Montserrat[wght].ttf") format("truetype"); font-weight: 100 900; }
      @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald[wght].ttf") format("truetype"); font-weight: 200 700; }
      @font-face { font-family: "Caveat"; src: url("assets/fonts/Caveat-700-latin.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Noto Color Emoji"; src: url("assets/fonts/NotoColorEmoji.ttf") format("truetype"); }
      :root { --ink: #ffffff; --blue: #9fd0ff; --deep: #0b1a3a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #stage { position: absolute; inset: 0; transform-origin: 50% 45%; }
      #stage video { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #scrim { position: absolute; left: 0; right: 0; top: 0; height: 1100px; z-index: 3; pointer-events: none;
               background: linear-gradient(to bottom, rgba(5, 10, 25, 0.55) 0%, rgba(5, 10, 25, 0.25) 45%, rgba(5, 10, 25, 0) 100%); }
      #dip { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 4; pointer-events: none; }
      .txt { position: absolute; left: 130px; right: 200px; z-index: 10; color: var(--ink); text-align: center; pointer-events: none; }
      .emoji { font-family: "Noto Color Emoji", sans-serif; }
      /* hook */
      #hook { top: 320px; left: 100px; right: 150px; }
      #hook .pov { font-family: "Montserrat"; font-weight: 700; font-size: 44px; letter-spacing: 0.22em; color: var(--blue); }
      #hook .l1 { font-family: "Montserrat"; font-weight: 800; font-size: 76px; white-space: nowrap; line-height: 1.02; margin-top: 10px;
                  text-shadow: 0 6px 30px rgba(0, 0, 0, 0.55); }
      #hook .l2 { font-family: "Caveat"; font-weight: 700; font-size: 132px; line-height: 1; color: var(--blue); margin-top: 6px;
                  text-shadow: 0 0 26px rgba(120, 180, 255, 0.55), 0 4px 20px rgba(0, 0, 0, 0.6); }
      /* rewind tag */
      #rw { top: 760px; font-family: "Oswald"; font-weight: 600; font-size: 66px; letter-spacing: 0.14em;
            text-shadow: -4px 0 0 rgba(255, 40, 80, 0.75), 4px 0 0 rgba(0, 220, 255, 0.75); }
      /* glass pills */
      .pill { display: flex; flex-direction: column; align-items: center; gap: 12px; }
      .pill .lab { font-family: "Montserrat"; font-weight: 600; font-size: 34px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--blue); }
      .pill .body { font-family: "Montserrat", "Noto Color Emoji"; font-weight: 700; font-size: 54px; line-height: 1.15; padding: 18px 38px;
                    border-radius: 999px; background: rgba(8, 16, 38, 0.5); border: 1.5px solid rgba(255, 255, 255, 0.22);
                    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35); }
      #p2 { top: 1010px; } #p5 { top: 380px; } #p6 { top: 360px; } #pend { top: 330px; }
      #pend .lab { font-size: 40px; letter-spacing: 0.12em; white-space: nowrap; color: #fff; text-shadow: 0 0 22px rgba(120,180,255,0.6), 0 4px 18px rgba(0,0,0,0.7); }
      .pill .body { font-size: 60px; }
      /* sentence, word by word grey → white */
      #lights { top: 380px; font-family: "Montserrat"; font-weight: 700; font-size: 66px; line-height: 1.15; text-shadow: 0 4px 24px rgba(0, 0, 0, 0.7); }
      #lights span { display: inline-block; color: rgba(255, 255, 255, 0.25); margin: 0 8px; }
      /* drop type */
      .big { font-family: "Oswald"; font-weight: 700; text-transform: uppercase; line-height: 0.9; letter-spacing: 0.02em;
             text-shadow: 0 0 40px rgba(110, 170, 255, 0.55), 0 8px 30px rgba(0, 0, 0, 0.6); }
      #goose { top: 540px; font-size: 128px; left: 100px; right: 130px; white-space: nowrap; }
      #goose span { display: inline-block; }
      .chap { font-family: "Oswald"; font-weight: 500; font-size: 46px; letter-spacing: 0.42em; color: var(--blue); }
      .hand { font-family: "Caveat", cursive; font-weight: 700; font-size: 150px; line-height: 1; left: 90px; right: 130px; white-space: nowrap;
              text-shadow: 0 0 24px rgba(140, 195, 255, 0.55), 0 4px 22px rgba(0, 0, 0, 0.75); }
      .hand .heart { font-size: 92px; display: inline-block; }
      #hwDear { top: 300px; } #hwCame { top: 330px; } #hwAlways { top: 470px; font-size: 136px; }
      #burst { position: absolute; inset: 0; z-index: 8; pointer-events: none; }
      #burst .ht { position: absolute; left: 540px; top: 900px; font-size: 90px; opacity: 0; }
      #loc { top: 1150px; display: flex; justify-content: center; }
      #loc span { font-family: "Montserrat", "Noto Color Emoji"; font-weight: 700; font-size: 42px; padding: 14px 30px; border-radius: 16px;
                  background: rgba(255, 255, 255, 0.92); color: #0b1a3a; box-shadow: 0 8px 26px rgba(0, 0, 0, 0.35); }
      #ch1 { top: 330px; } #ch2 { top: 330px; }
      #dard { top: 410px; font-size: 190px; }
    </style>
  </head>
